[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-object-store-local"
version = "0.2.0"
description = "Private local object storage for Toolframe plugins"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = ['toolframe-sdk==0.4.0']

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-object-store-local"
Repository = "https://github.com/toolframe/toolframe-object-store-local"
Documentation = "https://github.com/toolframe/toolframe-object-store-local#readme"
Issues = "https://github.com/toolframe/toolframe-object-store-local/issues"

[project.entry-points."toolframe.plugins"]
object-store-local = "toolframe_object_store_local.plugin:plugin"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
